<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{% block title %}hoerbox-feeder{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">

    <!-- PWA / Tablet-Verknüpfung -->
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="hoerbox-feeder">
    <meta name="application-name" content="hoerbox-feeder">
    <meta name="theme-color" content="#1c2733">

    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="logo">hoerbox-feeder</a>
        <nav>
            <a href="/">Start</a>
            <a href="/belegung">Belegung</a>
            <a href="/bearbeiten">Bearbeiten</a>
            <a href="/bibliothek">Bibliothek</a>
            <a href="/einrichtung">Setup</a>
            <a href="/logs">Logs</a>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p class="legal">{{ legal_notice }}</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
