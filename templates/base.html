<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{% block title %}hoerbox-feeder{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">

    <!-- PWA / Tablet-Verknüpfung -->
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="hoerbox-feeder">
    <meta name="application-name" content="hoerbox-feeder">
    <meta name="theme-color" content="#1c2733">

    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="logo">hoerbox-feeder</a>
        <nav>
            <a href="/">{{ t('nav.start') }}</a>
            <a href="/belegung">{{ t('nav.belegung') }}</a>
            <a href="/bearbeiten">{{ t('nav.bearbeiten') }}</a>
            <a href="/bibliothek">{{ t('nav.bibliothek') }}</a>
            <a href="/einrichtung">{{ t('nav.setup') }}</a>
            <a href="/logs">{{ t('nav.logs') }}</a>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p class="legal">{{ legal_notice }}</p>
    </footer>

    <script>
        window.HOERBOX_LANG = "{{ lang }}";
        window.HOERBOX_I18N = {{ js_i18n_json | safe }};
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
