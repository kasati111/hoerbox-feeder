{% extends "base.html" %}
{% block title %}{{ t('logs.title') }}{% endblock %}

{% block content %}
<section class="logs-page">
    <h1>{{ t('logs.h1') }}</h1>
    <p class="hint">{{ t('logs.hint', lines=lines) }}</p>

    <span class="log-live-indicator" id="log-live">{{ t('logs.live_indicator') }}</span>

    <pre class="log-box" id="log-box" data-lines="{{ lines }}">{{ content or t('logs.empty') }}</pre>

    <a href="/einrichtung" class="back-link">{{ t('logs.back_to_setup') }}</a>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/app.js"></script>
<script>hoerbox.initLogs();</script>
{% endblock %}
